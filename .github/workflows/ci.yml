name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      # The package's lowest iOS target, compiled for a device, so an API
      # newer than iOS 16 fails here rather than in an app's build.
      - name: Build for iOS 16
        run: xcodebuild build -scheme ForgeKit -destination 'generic/platform=iOS' IPHONEOS_DEPLOYMENT_TARGET=16.0 -quiet

  # Linux has no Keychain and no streamed URLSession bytes, so this job covers
  # the models, the mappings and the request shapes; macOS covers the rest.
  linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
